<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Builder — AI Resume Builder</title>
  <link rel="stylesheet" href="design-system.css">
  <link rel="stylesheet" href="app.css">
  <link rel="stylesheet" href="resume-app.css">
</head>
<body class="resume-app">

  <nav class="resume-nav" role="navigation">
    <a href="index.html" class="resume-nav__brand">AI Resume Builder</a>
    <ul class="resume-nav__links">
      <li><a href="builder.html" class="is-active">Builder</a></li>
      <li><a href="preview.html">Preview</a></li>
      <li><a href="proof.html">Proof</a></li>
    </ul>
  </nav>

  <div class="resume-builder">
    <div class="resume-builder__form">
      <div class="resume-builder__toolbar">
        <button type="button" class="kn-btn kn-btn--secondary" id="load-sample-btn">Load Sample Data</button>
      </div>

      <div class="resume-form-section">
        <h2 class="resume-form-section__title">Personal Info</h2>
        <div class="resume-form-row">
          <input type="text" class="kn-input" id="personal-name" placeholder="Full name">
          <input type="email" class="kn-input" id="personal-email" placeholder="Email">
        </div>
        <div class="resume-form-row">
          <input type="text" class="kn-input" id="personal-phone" placeholder="Phone">
          <input type="text" class="kn-input" id="personal-location" placeholder="Location">
        </div>
      </div>

      <div class="resume-form-section">
        <h2 class="resume-form-section__title">Summary</h2>
        <textarea class="kn-input" id="summary" placeholder="Brief professional summary…" rows="4"></textarea>
      </div>

      <div class="resume-form-section">
        <h2 class="resume-form-section__title">Education</h2>
        <ul class="resume-entries" id="education-list"></ul>
        <div class="resume-form-actions">
          <button type="button" class="kn-btn kn-btn--secondary" id="add-education">+ Add Education</button>
        </div>
      </div>

      <div class="resume-form-section">
        <h2 class="resume-form-section__title">Experience</h2>
        <ul class="resume-entries" id="experience-list"></ul>
        <div class="resume-form-actions">
          <button type="button" class="kn-btn kn-btn--secondary" id="add-experience">+ Add Experience</button>
        </div>
      </div>

      <div class="resume-form-section">
        <h2 class="resume-form-section__title">Projects</h2>
        <div id="projects-list"></div>
        <div class="resume-form-actions">
          <button type="button" class="kn-btn kn-btn--secondary" id="add-project">+ Add Project</button>
        </div>
      </div>

      <div class="resume-form-section">
        <h2 class="resume-form-section__title">Skills</h2>
        <div id="skills-section"></div>
        <div class="resume-form-actions" style="margin-top: var(--kn-space-2);">
          <button type="button" class="kn-btn kn-btn--secondary" id="suggest-skills-btn">✨ Suggest Skills</button>
        </div>
      </div>

      <div class="resume-form-section">
        <h2 class="resume-form-section__title">Links</h2>
        <div class="resume-form-row resume-form-row--single">
          <input type="url" class="kn-input" id="link-github" placeholder="GitHub URL">
        </div>
        <div class="resume-form-row resume-form-row--single">
          <input type="url" class="kn-input" id="link-linkedin" placeholder="LinkedIn URL">
        </div>
      </div>
    </div>

    <aside class="resume-builder__preview">
      <div class="template-picker" role="tablist" aria-label="Resume template">
        <button type="button" class="template-picker__thumb template-picker__thumb--classic" role="tab" data-template="classic" aria-selected="true" title="Classic">
          <span class="template-picker__sketch"></span>
          <span class="template-picker__label">Classic</span>
          <span class="template-picker__check" aria-hidden="true">✓</span>
        </button>
        <button type="button" class="template-picker__thumb template-picker__thumb--modern" role="tab" data-template="modern" aria-selected="false" title="Modern">
          <span class="template-picker__sketch"></span>
          <span class="template-picker__label">Modern</span>
          <span class="template-picker__check" aria-hidden="true">✓</span>
        </button>
        <button type="button" class="template-picker__thumb template-picker__thumb--minimal" role="tab" data-template="minimal" aria-selected="false" title="Minimal">
          <span class="template-picker__sketch"></span>
          <span class="template-picker__label">Minimal</span>
          <span class="template-picker__check" aria-hidden="true">✓</span>
        </button>
      </div>
      <div class="color-theme-picker" aria-label="Accent color">
        <button type="button" class="color-theme-picker__swatch" data-color="teal" title="Teal" style="background: hsl(168, 60%, 40%);"><span class="color-theme-picker__check" aria-hidden="true">✓</span></button>
        <button type="button" class="color-theme-picker__swatch" data-color="navy" title="Navy" style="background: hsl(220, 60%, 35%);"><span class="color-theme-picker__check" aria-hidden="true">✓</span></button>
        <button type="button" class="color-theme-picker__swatch" data-color="burgundy" title="Burgundy" style="background: hsl(345, 60%, 35%);"><span class="color-theme-picker__check" aria-hidden="true">✓</span></button>
        <button type="button" class="color-theme-picker__swatch" data-color="forest" title="Forest" style="background: hsl(150, 50%, 30%);"><span class="color-theme-picker__check" aria-hidden="true">✓</span></button>
        <button type="button" class="color-theme-picker__swatch" data-color="charcoal" title="Charcoal" style="background: hsl(0, 0%, 25%);"><span class="color-theme-picker__check" aria-hidden="true">✓</span></button>
      </div>
      <div class="ats-block" id="ats-block">
        <p class="ats-score__label">ATS Readiness Score</p>
        <div class="ats-score__meter-wrap">
          <div class="ats-score__meter" id="ats-meter" role="progressbar" aria-valuenow="0" aria-valuemin="0" aria-valuemax="100"></div>
        </div>
        <p class="ats-score__value"><span id="ats-score-value">0</span>/100</p>
        <ul class="ats-suggestions" id="ats-suggestions" aria-label="Suggestions to improve ATS score"></ul>
      </div>
      <div class="improvement-panel" id="improvement-panel">
        <p class="improvement-panel__title">Top 3 Improvements</p>
        <ul class="improvement-panel__list" id="improvement-list"></ul>
      </div>
      <div id="live-preview-wrap" data-template="classic">
        <div id="live-preview"></div>
      </div>
    </aside>
  </div>

  <script src="resume-app.js"></script>
  <script>
    (function () {
      var RA = window.ResumeApp;
      if (!RA) return;

      var previewEl = document.getElementById('live-preview');

      function getDataFromForm() {
        var data = RA.getEmptyResume();
        data.personal.name = (document.getElementById('personal-name') && document.getElementById('personal-name').value) || '';
        data.personal.email = (document.getElementById('personal-email') && document.getElementById('personal-email').value) || '';
        data.personal.phone = (document.getElementById('personal-phone') && document.getElementById('personal-phone').value) || '';
        data.personal.location = (document.getElementById('personal-location') && document.getElementById('personal-location').value) || '';
        data.summary = (document.getElementById('summary') && document.getElementById('summary').value) || '';
        data.skills = getSkillsFromForm();
        data.links.github = (document.getElementById('link-github') && document.getElementById('link-github').value) || '';
        data.links.linkedin = (document.getElementById('link-linkedin') && document.getElementById('link-linkedin').value) || '';
        data.education = getEducationFromForm();
        data.experience = getExperienceFromForm();
        data.projects = getProjectsFromForm();
        return data;
      }

      function getEducationFromForm() {
        var items = [];
        document.querySelectorAll('#education-list .resume-entry').forEach(function (el) {
          items.push({
            degree: (el.querySelector('.ed-degree') && el.querySelector('.ed-degree').value) || '',
            school: (el.querySelector('.ed-school') && el.querySelector('.ed-school').value) || '',
            location: (el.querySelector('.ed-location') && el.querySelector('.ed-location').value) || '',
            year: (el.querySelector('.ed-year') && el.querySelector('.ed-year').value) || ''
          });
        });
        return items;
      }

      function getExperienceFromForm() {
        var items = [];
        document.querySelectorAll('#experience-list .resume-entry').forEach(function (el) {
          items.push({
            title: (el.querySelector('.exp-title') && el.querySelector('.exp-title').value) || '',
            company: (el.querySelector('.exp-company') && el.querySelector('.exp-company').value) || '',
            location: (el.querySelector('.exp-location') && el.querySelector('.exp-location').value) || '',
            period: (el.querySelector('.exp-period') && el.querySelector('.exp-period').value) || '',
            description: (el.querySelector('.exp-desc') && el.querySelector('.exp-desc').value) || ''
          });
        });
        return items;
      }

      function getSkillsFromForm() {
        function getPills(containerId) {
          var el = document.getElementById(containerId);
          if (!el) return [];
          var pills = el.querySelectorAll('.skill-pill');
          var arr = [];
          pills.forEach(function (p) {
            var t = (p.getAttribute('data-skill') || p.textContent || '').replace(/\s*×\s*$/, '').trim();
            if (t) arr.push(t);
          });
          return arr;
        }
        return {
          technical: getPills('skills-technical-pills'),
          softSkills: getPills('skills-soft-pills'),
          tools: getPills('skills-tools-pills')
        };
      }

      function getProjectsFromForm() {
        var items = [];
        document.querySelectorAll('#projects-list .project-accordion').forEach(function (el) {
          var techStack = [];
          (el.querySelectorAll('.proj-tech-pill') || []).forEach(function (p) {
            var t = (p.getAttribute('data-tech') || p.textContent || '').replace(/\s*×\s*$/, '').trim();
            if (t) techStack.push(t);
          });
          items.push({
            name: (el.querySelector('.proj-name') && el.querySelector('.proj-name').value) || '',
            description: (el.querySelector('.proj-desc') && el.querySelector('.proj-desc').value) || '',
            techStack: techStack,
            liveUrl: (el.querySelector('.proj-live-url') && el.querySelector('.proj-live-url').value) || '',
            githubUrl: (el.querySelector('.proj-github-url') && el.querySelector('.proj-github-url').value) || ''
          });
        });
        return items;
      }

      function setFormFromData(data) {
        var p = data.personal || {};
        setVal('personal-name', p.name);
        setVal('personal-email', p.email);
        setVal('personal-phone', p.phone);
        setVal('personal-location', p.location);
        setVal('summary', data.summary || '');
        setVal('link-github', (data.links && data.links.github) || '');
        setVal('link-linkedin', (data.links && data.links.linkedin) || '');
        renderEducationList(data.education || []);
        renderExperienceList(data.experience || []);
        renderSkillsSection(data.skills || { technical: [], softSkills: [], tools: [] });
        renderProjectsList(data.projects || []);
      }

      function setVal(id, val) {
        var el = document.getElementById(id);
        if (el) el.value = val;
      }

      function renderEducationList(items) {
        var list = document.getElementById('education-list');
        if (!list) return;
        list.innerHTML = '';
        (items.length ? items : [{ degree: '', school: '', location: '', year: '' }]).forEach(function (e, i) {
          var li = document.createElement('li');
          li.className = 'resume-entry';
          li.innerHTML = '<div class="resume-entry__row"><input type="text" class="kn-input ed-degree" placeholder="Degree"><input type="text" class="kn-input ed-school" placeholder="School"></div>' +
            '<div class="resume-entry__row"><input type="text" class="kn-input ed-location" placeholder="Location"><input type="text" class="kn-input ed-year" placeholder="Year"></div>' +
            '<div class="resume-entry__actions"><button type="button" class="kn-btn kn-btn--secondary remove-ed">Remove</button></div>';
          li.querySelector('.ed-degree').value = e.degree || '';
          li.querySelector('.ed-school').value = e.school || '';
          li.querySelector('.ed-location').value = e.location || '';
          li.querySelector('.ed-year').value = e.year || '';
          list.appendChild(li);
        });
        bindListEvents('education-list', '.remove-ed', renderEducationList, getEducationFromForm, addEducationRow);
      }

      function addEducationRow() {
        var list = document.getElementById('education-list');
        if (!list) return;
        var items = getEducationFromForm();
        items.push({ degree: '', school: '', location: '', year: '' });
        renderEducationList(items);
        sync();
      }

      function renderExperienceList(items) {
        var list = document.getElementById('experience-list');
        if (!list) return;
        list.innerHTML = '';
        (items.length ? items : [{ title: '', company: '', location: '', period: '', description: '' }]).forEach(function (e) {
          var li = document.createElement('li');
          li.className = 'resume-entry';
          li.innerHTML = '<div class="resume-entry__row"><input type="text" class="kn-input exp-title" placeholder="Job title"><input type="text" class="kn-input exp-company" placeholder="Company"></div>' +
            '<div class="resume-entry__row"><input type="text" class="kn-input exp-location" placeholder="Location"><input type="text" class="kn-input exp-period" placeholder="Period"></div>' +
            '<div class="resume-entry__row resume-entry__row--full"><textarea class="kn-input exp-desc" placeholder="Description (one bullet per line)" rows="2"></textarea><div class="bullet-guidance" aria-live="polite"></div></div>' +
            '<div class="resume-entry__actions"><button type="button" class="kn-btn kn-btn--secondary remove-exp">Remove</button></div>';
          li.querySelector('.exp-title').value = e.title || '';
          li.querySelector('.exp-company').value = e.company || '';
          li.querySelector('.exp-location').value = e.location || '';
          li.querySelector('.exp-period').value = e.period || '';
          li.querySelector('.exp-desc').value = e.description || '';
          list.appendChild(li);
        });
        bindListEvents('experience-list', '.remove-exp', renderExperienceList, getExperienceFromForm, addExperienceRow);
      }

      function addExperienceRow() {
        var items = getExperienceFromForm();
        items.push({ title: '', company: '', location: '', period: '', description: '' });
        renderExperienceList(items);
        sync();
      }

      function renderSkillsSection(skills) {
        var section = document.getElementById('skills-section');
        if (!section) return;
        var sk = skills && typeof skills === 'object' ? skills : { technical: [], softSkills: [], tools: [] };
        var categories = [
          { id: 'technical', label: 'Technical Skills', key: 'technical', pillsId: 'skills-technical-pills', inputId: 'skills-technical-input' },
          { id: 'soft', label: 'Soft Skills', key: 'softSkills', pillsId: 'skills-soft-pills', inputId: 'skills-soft-input' },
          { id: 'tools', label: 'Tools & Technologies', key: 'tools', pillsId: 'skills-tools-pills', inputId: 'skills-tools-input' }
        ];
        section.innerHTML = categories.map(function (cat) {
          var arr = sk[cat.key] || [];
          var pillsHtml = arr.map(function (s) { return '<span class="skill-pill" data-skill="' + RA.escapeHtml(s) + '">' + RA.escapeHtml(s) + ' <button type="button" class="skill-pill-remove" aria-label="Remove">×</button></span>'; }).join('');
          return '<div class="skill-group"><span class="skill-group__label">' + RA.escapeHtml(cat.label) + ' (' + arr.length + ')</span>' +
            '<div class="skill-tag-row"><input type="text" class="kn-input skill-tag-input" id="' + cat.inputId + '" data-category="' + cat.key + '" placeholder="Type skill and press Enter" maxlength="80">' +
            '</div><div class="skill-pills" id="' + cat.pillsId + '">' + pillsHtml + '</div></div>';
        }).join('');
        categories.forEach(function (cat) {
          var input = document.getElementById(cat.inputId);
          var pillsEl = document.getElementById(cat.pillsId);
          if (input) {
            input.onkeydown = function (e) {
              if (e.key === 'Enter') {
                e.preventDefault();
                var val = (input.value || '').trim();
                if (!val) return;
                var data = getDataFromForm();
                var arr = (data.skills && data.skills[cat.key]) ? data.skills[cat.key].slice() : [];
                if (arr.indexOf(val) === -1) arr.push(val);
                data.skills = data.skills || { technical: [], softSkills: [], tools: [] };
                data.skills[cat.key] = arr;
                RA.setResumeData(data);
                renderSkillsSection(data.skills);
                sync();
                input.value = '';
              }
            };
          }
          if (pillsEl) {
            pillsEl.querySelectorAll('.skill-pill-remove').forEach(function (btn) {
              btn.onclick = function () {
                var pill = btn.closest('.skill-pill');
                var skill = pill ? (pill.getAttribute('data-skill') || pill.textContent.replace(/\s*×\s*$/, '').trim()) : '';
                if (!skill) return;
                var data = getDataFromForm();
                var arr = ((data.skills && data.skills[cat.key]) ? data.skills[cat.key] : []).filter(function (s) { return s !== skill; });
                data.skills = data.skills || { technical: [], softSkills: [], tools: [] };
                data.skills[cat.key] = arr;
                RA.setResumeData(data);
                renderSkillsSection(data.skills);
                sync();
              };
            });
          }
        });
      }

      function renderProjectsList(items) {
        var list = document.getElementById('projects-list');
        if (!list) return;
        list.innerHTML = '';
        (items.length ? items : [{ name: '', description: '', techStack: [], liveUrl: '', githubUrl: '' }]).forEach(function (e, idx) {
          var techPills = (e.techStack || []).map(function (t) { return '<span class="skill-pill proj-tech-pill" data-tech="' + RA.escapeHtml(t) + '">' + RA.escapeHtml(t) + ' <button type="button" class="skill-pill-remove" aria-label="Remove">×</button></span>'; }).join('');
          var title = (e.name || '').trim() || 'New project';
          var div = document.createElement('div');
          div.className = 'project-accordion';
          div.innerHTML = '<details class="project-accordion__details" open="' + (idx === 0 ? 'open' : '') + '">' +
            '<summary class="project-accordion__header">' + RA.escapeHtml(title) + '</summary>' +
            '<div class="project-accordion__body">' +
            '<div class="resume-entry__row resume-entry__row--full"><input type="text" class="kn-input proj-name" placeholder="Project title" value="' + RA.escapeHtml(e.name || '') + '"></div>' +
            '<div class="resume-entry__row resume-entry__row--full"><label class="form-label">Description <span class="desc-char-count">0/200</span></label><textarea class="kn-input proj-desc" placeholder="Description (max 200 chars)" rows="2" maxlength="200"></textarea><div class="bullet-guidance" aria-live="polite"></div></div>' +
            '<div class="resume-entry__row resume-entry__row--full"><label class="form-label">Tech stack</label><input type="text" class="kn-input proj-tech-input" placeholder="Type and press Enter" maxlength="60"><div class="skill-pills proj-tech-pills" id="proj-tech-pills-' + idx + '">' + techPills + '</div></div>' +
            '<div class="resume-entry__row resume-entry__row--full"><input type="url" class="kn-input proj-live-url" placeholder="Live URL (optional)" value="' + RA.escapeHtml(e.liveUrl || '') + '"></div>' +
            '<div class="resume-entry__row resume-entry__row--full"><input type="url" class="kn-input proj-github-url" placeholder="GitHub URL (optional)" value="' + RA.escapeHtml(e.githubUrl || '') + '"></div>' +
            '<div class="resume-entry__actions"><button type="button" class="kn-btn kn-btn--secondary remove-proj">Delete project</button></div>' +
            '</div></details>';
          var nameInput = div.querySelector('.proj-name');
          var descInput = div.querySelector('.proj-desc');
          if (nameInput) nameInput.value = e.name || '';
          if (descInput) {
            descInput.value = (e.description || '').slice(0, 200);
            var updateCount = function () { var c = descInput.closest('.project-accordion').querySelector('.desc-char-count'); if (c) c.textContent = descInput.value.length + '/200'; };
            updateCount();
            descInput.oninput = function () { updateCount(); sync(); };
          }
          if (nameInput) {
            nameInput.oninput = function () {
              sync();
              var sum = div.querySelector('summary');
              if (sum) sum.textContent = (nameInput.value || '').trim() || 'New project';
            };
          }
          div.querySelectorAll('.skill-pill-remove').forEach(function (btn) {
            btn.onclick = function () {
              var pill = btn.closest('.proj-tech-pill');
              if (!pill) return;
              var tech = pill.getAttribute('data-tech') || pill.textContent.replace(/\s*×\s*$/, '').trim();
              var items = getProjectsFromForm();
              var proj = items[idx] || {};
              proj.techStack = (proj.techStack || []).filter(function (t) { return t !== tech; });
              items[idx] = proj;
              var data = getDataFromForm();
              data.projects = items;
              RA.setResumeData(data);
              renderProjectsList(data.projects);
              sync();
            };
          });
          var techInput = div.querySelector('.proj-tech-input');
          if (techInput) {
            techInput.onkeydown = function (ev) {
              if (ev.key === 'Enter') {
                ev.preventDefault();
                var val = (techInput.value || '').trim();
                if (!val) return;
                var items = getProjectsFromForm();
                var proj = items[idx] || { name: '', description: '', techStack: [], liveUrl: '', githubUrl: '' };
                proj.techStack = proj.techStack || [];
                if (proj.techStack.indexOf(val) === -1) proj.techStack.push(val);
                items[idx] = proj;
                var data = getDataFromForm();
                data.projects = items;
                RA.setResumeData(data);
                renderProjectsList(data.projects);
                sync();
                techInput.value = '';
              }
            };
          }
          div.querySelector('.remove-proj').onclick = function () {
            var items = getProjectsFromForm();
            if (items.length <= 1) return;
            items.splice(idx, 1);
            var data = getDataFromForm();
            data.projects = items;
            RA.setResumeData(data);
            renderProjectsList(data.projects);
            sync();
          };
          list.appendChild(div);
        });
        list.querySelectorAll('.proj-name, .proj-desc, .proj-live-url, .proj-github-url').forEach(function (el) {
          el.oninput = sync;
        });
        list.querySelectorAll('summary').forEach(function (s) {
          s.onclick = function () { setTimeout(function () { sync(); }, 0); };
        });
        updateBulletGuidance();
      }

      function addProjectRow() {
        var items = getProjectsFromForm();
        items.push({ name: '', description: '', techStack: [], liveUrl: '', githubUrl: '' });
        var data = getDataFromForm();
        data.projects = items;
        RA.setResumeData(data);
        renderProjectsList(data.projects);
        sync();
      }

      function bindListEvents(listId, removeSelector, renderFn, getItemsFn, addFn) {
        var list = document.getElementById(listId);
        if (!list) return;
        list.querySelectorAll(removeSelector).forEach(function (btn) {
          btn.onclick = function () {
            var items = getItemsFn();
            if (items.length <= 1) return;
            var idx = Array.prototype.indexOf.call(list.children, btn.closest('.resume-entry'));
            items.splice(idx, 1);
            renderFn(items);
            sync();
          };
        });
        list.querySelectorAll('input, textarea').forEach(function (input) {
          input.oninput = sync;
        });
      }

      function updateATS(data) {
        var result = RA.computeATSScore(data);
        var score = result.score;
        var band = RA.getATSBand(score);
        var suggestions = result.suggestions || [];
        var valueEl = document.getElementById('ats-score-value');
        var meterEl = document.getElementById('ats-meter');
        var listEl = document.getElementById('ats-suggestions');
        var blockEl = document.getElementById('ats-block');
        if (valueEl) valueEl.textContent = score;
        if (meterEl) {
          meterEl.style.width = score + '%';
          meterEl.setAttribute('aria-valuenow', score);
        }
        if (blockEl) {
          blockEl.classList.remove('ats-block--low', 'ats-block--medium', 'ats-block--high');
          blockEl.classList.add('ats-block--' + band.level);
        }
        if (listEl) {
          listEl.innerHTML = suggestions.map(function (s) {
            return '<li class="ats-suggestions__item">' + RA.escapeHtml(s) + '</li>';
          }).join('');
        }
      }

      function updateImprovements(data) {
        var list = RA.getTopImprovements(data);
        var listEl = document.getElementById('improvement-list');
        if (!listEl) return;
        listEl.innerHTML = list.map(function (s) {
          return '<li class="improvement-panel__item">' + RA.escapeHtml(s) + '</li>';
        }).join('');
      }

      function updateBulletGuidance() {
        document.querySelectorAll('.exp-desc').forEach(function (ta) {
          var guidance = ta.nextElementSibling;
          if (!guidance || !guidance.classList.contains('bullet-guidance')) return;
          var g = RA.getBulletGuidance(ta.value);
          var parts = [];
          if (g.needActionVerb) parts.push('Start with a strong action verb.');
          if (g.needNumber) parts.push('Add measurable impact (numbers).');
          guidance.textContent = parts.length ? parts.join(' ') : '';
          guidance.className = 'bullet-guidance' + (parts.length ? ' bullet-guidance--visible' : '');
        });
        document.querySelectorAll('.proj-desc').forEach(function (ta) {
          var guidance = ta.nextElementSibling;
          if (!guidance || !guidance.classList.contains('bullet-guidance')) return;
          var g = RA.getBulletGuidance(ta.value);
          var parts = [];
          if (g.needActionVerb) parts.push('Start with a strong action verb.');
          if (g.needNumber) parts.push('Add measurable impact (numbers).');
          guidance.textContent = parts.length ? parts.join(' ') : '';
          guidance.className = 'bullet-guidance' + (parts.length ? ' bullet-guidance--visible' : '');
        });
      }

      function applyTemplate(key) {
        var wrap = document.getElementById('live-preview-wrap');
        if (wrap) wrap.setAttribute('data-template', key);
        document.querySelectorAll('.template-picker__thumb').forEach(function (btn) {
          var isSelected = btn.getAttribute('data-template') === key;
          btn.classList.toggle('template-picker__thumb--active', isSelected);
          btn.setAttribute('aria-selected', isSelected ? 'true' : 'false');
        });
        RA.renderLivePreview(RA.getResumeData(), previewEl);
      }

      function applyTheme(colorKey) {
        var wrap = document.getElementById('live-preview-wrap');
        if (wrap) wrap.style.setProperty('--resume-accent', RA.getThemeColorHsl(colorKey));
        document.querySelectorAll('.color-theme-picker__swatch').forEach(function (btn) {
          btn.classList.toggle('color-theme-picker__swatch--active', btn.getAttribute('data-color') === colorKey);
        });
      }

      function sync() {
        var data = getDataFromForm();
        RA.setResumeData(data);
        RA.renderLivePreview(data, previewEl);
        updateATS(data);
        updateImprovements(data);
        updateBulletGuidance();
      }

      document.getElementById('add-education').onclick = addEducationRow;
      document.getElementById('add-experience').onclick = addExperienceRow;
      document.getElementById('add-project').onclick = addProjectRow;

      document.getElementById('suggest-skills-btn').onclick = function () {
        var btn = document.getElementById('suggest-skills-btn');
        btn.disabled = true;
        btn.textContent = 'Loading...';
        setTimeout(function () {
          var suggested = RA.getSuggestedSkills();
          var data = getDataFromForm();
          data.skills = data.skills || { technical: [], softSkills: [], tools: [] };
          ['technical', 'softSkills', 'tools'].forEach(function (key) {
            var current = data.skills[key] || [];
            var add = suggested[key] || [];
            add.forEach(function (s) {
              if (current.indexOf(s) === -1) current.push(s);
            });
            data.skills[key] = current;
          });
          RA.setResumeData(data);
          renderSkillsSection(data.skills);
          sync();
          btn.disabled = false;
          btn.textContent = '✨ Suggest Skills';
        }, 1000);
      };

      ['personal-name', 'personal-email', 'personal-phone', 'personal-location', 'summary', 'skills', 'link-github', 'link-linkedin'].forEach(function (id) {
        var el = document.getElementById(id);
        if (el) el.oninput = sync;
      });

      document.getElementById('load-sample-btn').onclick = function () {
        var sample = RA.getSampleResume();
        RA.setResumeData(sample);
        setFormFromData(sample);
        RA.renderLivePreview(sample, previewEl);
        updateATS(sample);
        updateImprovements(sample);
        updateBulletGuidance();
      };

      document.querySelectorAll('.template-picker__thumb').forEach(function (btn) {
        btn.onclick = function () {
          var key = btn.getAttribute('data-template');
          if (!key) return;
          RA.setTemplate(key);
          applyTemplate(key);
        };
      });

      document.querySelectorAll('.color-theme-picker__swatch').forEach(function (btn) {
        btn.onclick = function () {
          var colorKey = btn.getAttribute('data-color');
          if (!colorKey) return;
          RA.setThemeColor(colorKey);
          applyTheme(colorKey);
        };
      });

      var initialData = RA.getResumeData();
      setFormFromData(initialData);
      applyTemplate(RA.getTemplate());
      applyTheme(RA.getThemeColor());
      updateATS(initialData);
      updateImprovements(initialData);
      updateBulletGuidance();
    })();
  </script>
</body>
</html>
