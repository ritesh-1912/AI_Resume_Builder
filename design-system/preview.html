<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Preview — AI Resume Builder</title>
  <link rel="stylesheet" href="design-system.css">
  <link rel="stylesheet" href="app.css">
  <link rel="stylesheet" href="resume-app.css">
</head>
<body class="resume-app">

  <nav class="resume-nav" role="navigation">
    <a href="index.html" class="resume-nav__brand">AI Resume Builder</a>
    <ul class="resume-nav__links">
      <li><a href="builder.html">Builder</a></li>
      <li><a href="preview.html" class="is-active">Preview</a></li>
      <li><a href="proof.html">Proof</a></li>
    </ul>
  </nav>

  <main class="resume-preview-page">
    <div class="template-tabs template-tabs--preview" role="tablist" aria-label="Resume template">
      <button type="button" class="template-tabs__btn" role="tab" data-template="classic" aria-selected="true">Classic</button>
      <button type="button" class="template-tabs__btn" role="tab" data-template="modern" aria-selected="false">Modern</button>
      <button type="button" class="template-tabs__btn" role="tab" data-template="minimal" aria-selected="false">Minimal</button>
    </div>
    <div id="preview-content"></div>
  </main>

  <script src="resume-app.js"></script>
  <script>
    (function () {
      var RA = window.ResumeApp;
      var container = document.getElementById('preview-content');
      if (RA && container) {
        container.setAttribute('data-template', RA.getTemplate());
        RA.renderPreviewPage(container);
        document.querySelectorAll('.template-tabs__btn').forEach(function (btn) {
          btn.onclick = function () {
            var key = btn.getAttribute('data-template');
            if (!key) return;
            RA.setTemplate(key);
            container.setAttribute('data-template', key);
            document.querySelectorAll('.template-tabs__btn').forEach(function (b) {
              var sel = b.getAttribute('data-template') === key;
              b.classList.toggle('template-tabs__btn--active', sel);
              b.setAttribute('aria-selected', sel ? 'true' : 'false');
            });
          };
        });
        var current = RA.getTemplate();
        document.querySelectorAll('.template-tabs__btn').forEach(function (b) {
          b.classList.toggle('template-tabs__btn--active', b.getAttribute('data-template') === current);
          b.setAttribute('aria-selected', b.getAttribute('data-template') === current ? 'true' : 'false');
        });
      }
    })();
  </script>
</body>
</html>
