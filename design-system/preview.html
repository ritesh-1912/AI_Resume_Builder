<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Preview — AI Resume Builder</title>
  <link rel="stylesheet" href="design-system.css">
  <link rel="stylesheet" href="app.css">
  <link rel="stylesheet" href="resume-app.css">
</head>
<body class="resume-app">

  <nav class="resume-nav no-print" role="navigation">
    <a href="index.html" class="resume-nav__brand">AI Resume Builder</a>
    <ul class="resume-nav__links">
      <li><a href="builder.html">Builder</a></li>
      <li><a href="preview.html" class="is-active">Preview</a></li>
    </ul>
  </nav>

  <main class="resume-preview-page">
    <div class="template-picker template-picker--preview no-print" role="tablist" aria-label="Resume template">
      <button type="button" class="template-picker__thumb template-picker__thumb--classic" role="tab" data-template="classic" aria-selected="true" title="Classic">
        <span class="template-picker__sketch"></span>
        <span class="template-picker__label">Classic</span>
        <span class="template-picker__check" aria-hidden="true">✓</span>
      </button>
      <button type="button" class="template-picker__thumb template-picker__thumb--modern" role="tab" data-template="modern" aria-selected="false" title="Modern">
        <span class="template-picker__sketch"></span>
        <span class="template-picker__label">Modern</span>
        <span class="template-picker__check" aria-hidden="true">✓</span>
      </button>
      <button type="button" class="template-picker__thumb template-picker__thumb--minimal" role="tab" data-template="minimal" aria-selected="false" title="Minimal">
        <span class="template-picker__sketch"></span>
        <span class="template-picker__label">Minimal</span>
        <span class="template-picker__check" aria-hidden="true">✓</span>
      </button>
    </div>
    <div class="color-theme-picker color-theme-picker--preview no-print" aria-label="Accent color">
      <button type="button" class="color-theme-picker__swatch" data-color="teal" title="Teal" style="background: hsl(168, 60%, 40%);"><span class="color-theme-picker__check" aria-hidden="true">✓</span></button>
      <button type="button" class="color-theme-picker__swatch" data-color="navy" title="Navy" style="background: hsl(220, 60%, 35%);"><span class="color-theme-picker__check" aria-hidden="true">✓</span></button>
      <button type="button" class="color-theme-picker__swatch" data-color="burgundy" title="Burgundy" style="background: hsl(345, 60%, 35%);"><span class="color-theme-picker__check" aria-hidden="true">✓</span></button>
      <button type="button" class="color-theme-picker__swatch" data-color="forest" title="Forest" style="background: hsl(150, 50%, 30%);"><span class="color-theme-picker__check" aria-hidden="true">✓</span></button>
      <button type="button" class="color-theme-picker__swatch" data-color="charcoal" title="Charcoal" style="background: hsl(0, 0%, 25%);"><span class="color-theme-picker__check" aria-hidden="true">✓</span></button>
    </div>
    <div class="ats-preview no-print" id="ats-preview" aria-label="ATS Resume Score">
      <div class="ats-circle-wrap">
        <div class="ats-circle" id="ats-circle">
          <svg class="ats-circle__svg" viewBox="0 0 36 36" aria-hidden="true">
            <path class="ats-circle__bg" d="M18 2.5 a 15.5 15.5 0 0 1 0 31 a 15.5 15.5 0 0 1 0 -31" />
            <path class="ats-circle__fill" id="ats-circle-fill" d="M18 2.5 a 15.5 15.5 0 0 1 0 31 a 15.5 15.5 0 0 1 0 -31" />
          </svg>
          <span class="ats-circle__value" id="ats-circle-value">0</span>
        </div>
      </div>
      <p class="ats-preview__band" id="ats-band-label">Needs Work</p>
      <p class="ats-preview__hint">Based on resume completeness</p>
      <ul class="ats-preview__suggestions" id="ats-preview-suggestions" aria-label="Suggestions to improve ATS score"></ul>
    </div>
    <div class="preview-export-actions no-print">
      <button type="button" class="kn-btn kn-btn--primary" id="btn-print-pdf">Download PDF</button>
      <button type="button" class="kn-btn kn-btn--secondary" id="btn-copy-text">Copy Resume as Text</button>
      <p class="preview-export-warning" id="export-warning" aria-live="polite" hidden></p>
    </div>
    <div id="preview-content" class="preview-print-area"></div>
    <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
  </main>

  <script src="resume-app.js"></script>
  <script>
    (function () {
      var RA = window.ResumeApp;
      var container = document.getElementById('preview-content');
      if (!RA || !container) return;

      function applyTemplate(key) {
        container.setAttribute('data-template', key);
        document.querySelectorAll('.template-picker__thumb').forEach(function (b) {
          var sel = b.getAttribute('data-template') === key;
          b.classList.toggle('template-picker__thumb--active', sel);
          b.setAttribute('aria-selected', sel ? 'true' : 'false');
        });
        RA.renderPreviewPage(container);
      }

      function applyTheme(colorKey) {
        container.style.setProperty('--resume-accent', RA.getThemeColorHsl(colorKey));
        document.querySelectorAll('.color-theme-picker__swatch').forEach(function (b) {
          b.classList.toggle('color-theme-picker__swatch--active', b.getAttribute('data-color') === colorKey);
        });
      }

      function showToast(message) {
        var el = document.getElementById('toast');
        if (!el) return;
        el.textContent = message;
        el.hidden = false;
        setTimeout(function () { el.hidden = true; }, 3000);
      }

      function updateATSPreview() {
        var data = RA.getResumeData();
        var result = RA.computeATSScore(data);
        var score = result.score;
        var band = RA.getATSBand(score);
        var fillEl = document.getElementById('ats-circle-fill');
        var valueEl = document.getElementById('ats-circle-value');
        var bandEl = document.getElementById('ats-band-label');
        var listEl = document.getElementById('ats-preview-suggestions');
        var wrapEl = document.getElementById('ats-preview');
        if (valueEl) valueEl.textContent = score;
        if (bandEl) {
          bandEl.textContent = band.label;
          bandEl.className = 'ats-preview__band ats-preview__band--' + band.level;
        }
        if (wrapEl) {
          wrapEl.className = 'ats-preview no-print ats-preview--' + band.level;
        }
        if (fillEl) {
          var circumference = 2 * Math.PI * 15.5;
          var dash = (score / 100) * circumference;
          fillEl.style.strokeDasharray = dash + ' ' + circumference;
        }
        if (listEl) {
          listEl.innerHTML = (result.suggestions || []).map(function (s) {
            return '<li class="ats-preview__suggestion">' + RA.escapeHtml(s) + '</li>';
          }).join('');
        }
      }

      applyTemplate(RA.getTemplate());
      applyTheme(RA.getThemeColor());
      updateATSPreview();

      document.querySelectorAll('.template-picker__thumb').forEach(function (btn) {
        btn.onclick = function () {
          var key = btn.getAttribute('data-template');
          if (!key) return;
          RA.setTemplate(key);
          applyTemplate(key);
        };
      });

      document.querySelectorAll('.color-theme-picker__swatch').forEach(function (btn) {
        btn.onclick = function () {
          var colorKey = btn.getAttribute('data-color');
          if (!colorKey) return;
          RA.setThemeColor(colorKey);
          applyTheme(colorKey);
        };
      });

      function updateExportWarning() {
        var msg = RA.getExportValidationWarning(RA.getResumeData());
        var el = document.getElementById('export-warning');
        if (el) {
          el.textContent = msg || '';
          el.hidden = !msg;
        }
      }
      updateExportWarning();

      document.getElementById('btn-print-pdf').onclick = function () {
        updateExportWarning();
        showToast('PDF export ready! Check your downloads.');
        window.print();
      };

      document.getElementById('btn-copy-text').onclick = function () {
        updateExportWarning();
        var text = RA.getResumeAsPlainText(RA.getResumeData());
        navigator.clipboard.writeText(text).then(function () {
          var btn = document.getElementById('btn-copy-text');
          var orig = btn.textContent;
          btn.textContent = 'Copied!';
          setTimeout(function () { btn.textContent = orig; }, 2000);
        }).catch(function () {});
      };
    })();
  </script>
</body>
</html>
